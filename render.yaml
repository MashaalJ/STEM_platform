# Render Blueprint: deploy Stemverse from GitHub
# Set SESSION_SECRET in Render Dashboard → Service → Environment (secret, 32+ chars).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stemverse
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: stemverse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Required in Render Dashboard → Environment (then redeploy):
      # SUPABASE_URL — project URL (Settings → API)
      # SUPABASE_SERVICE_ROLE_KEY — service_role secret (login/signup fail with 503 if missing)
      # SUPABASE_ANON_KEY — anon public key
      # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — same as above (build-time for the SPA)
      # Optional: FRONTEND_URL=https://your-service.onrender.com
