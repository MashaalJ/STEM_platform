# Render Blueprint: deploy Stemverse from GitHub
# Set SESSION_SECRET in Render Dashboard → Service → Environment (secret, 32+ chars).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stemverse
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: stemverse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Required in Render Dashboard → Environment:
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY
      # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (same values as above)
      # Optional: FRONTEND_URL=https://your-service.onrender.com
