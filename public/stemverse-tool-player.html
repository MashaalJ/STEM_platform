<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>STEMverse Tool Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080B1A;
      --panel: #0D0D1A;
      --panel-border: #1E1E3A;
      --canvas-bg: #0f172a;
      --teal: #2dd4bf;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Space Grotesk", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
    }
    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #topbar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #080810;
      border-bottom: 1px solid #1A1A2E;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    #topbar .logo { display: none; }
    #topbar .title {
      font-weight: 500;
      font-size: 15px;
      color: #fff;
      text-align: center;
      flex: 1;
      padding: 0 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #topbar .step-counter {
      font-size: 12px;
      font-weight: 500;
      color: #2DD4BF;
      white-space: nowrap;
      background: #0F2A1F;
      border: 1px solid rgba(45, 212, 191, 0.3);
      border-radius: 20px;
      padding: 4px 12px;
    }
    #topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #btn-save { display: none !important; }
    .btn-save {
      display: none;
    }
    #save-toast {
      position: fixed;
      top: 56px;
      right: 16px;
      z-index: 90;
      background: #0A192F;
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #save-toast.visible { opacity: 1; }
    #main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #left-panel {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
    }
    .panel-top-bar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .stembot-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-height: 0;
      padding: 16px 14px;
      overflow-y: auto;
    }
    .speech-bubble {
      background: #1A1A2E;
      color: #E2E8F0;
      border: 1px solid #2D2D50;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      max-width: 220px;
      min-height: 48px;
      margin-bottom: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .speech-bubble::before {
      content: "";
      position: absolute;
      bottom: -11px;
      left: calc(50% - 8px);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #2D2D50;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: calc(50% - 8px);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 9px solid #1A1A2E;
    }
    .speech-bubble .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--teal);
      margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #stembot-orb.orb-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      box-shadow: none !important;
    }
    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(139, 92, 246, 0.4);
      box-shadow:
        0 0 20px rgba(139, 92, 246, 0.3),
        0 0 40px rgba(139, 92, 246, 0.15),
        inset 0 0 20px rgba(139, 92, 246, 0.1);
      animation: orb-breathe 3s ease-in-out infinite;
    }
    @keyframes orb-breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.15), inset 0 0 20px rgba(139, 92, 246, 0.1);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 28px rgba(139, 92, 246, 0.5), 0 0 56px rgba(139, 92, 246, 0.25), inset 0 0 20px rgba(139, 92, 246, 0.1);
      }
    }
    .orb-inner {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7C3AED, #4C1D95);
      box-shadow: 0 4px 20px rgba(76, 29, 149, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: background 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb-face {
      width: 80px;
      height: 80px;
      pointer-events: none;
    }
    .orb-eye {
      fill: #fff;
    }
    .orb-smile {
      stroke: #fff;
    }
    #stembot-orb.emotion-idle .orb-inner {
      background: radial-gradient(circle at 35% 35%, #7C3AED, #4C1D95);
    }
    #stembot-orb.emotion-thinking .orb-inner {
      background: radial-gradient(circle at 35% 35%, #2563EB, #1D4ED8);
    }
    #stembot-orb.emotion-correct .orb-inner,
    #stembot-orb.emotion-excited .orb-inner {
      background: radial-gradient(circle at 35% 35%, #059669, #065F46);
    }
    #stembot-orb.emotion-celebrate .orb-inner {
      background: radial-gradient(circle at 35% 35%, #D97706, #92400E);
      animation: orb-spin 0.8s ease;
    }
    #stembot-orb.emotion-hint .orb-inner {
      background: radial-gradient(circle at 35% 35%, #DC2626, #7F1D1D);
    }
    #stembot-orb.emotion-hint.orb-wrap {
      animation: shake-orb 0.5s ease;
    }
    #stembot-orb.emotion-correct .orb-eye,
    #stembot-orb.emotion-celebrate .orb-eye,
    #stembot-orb.emotion-excited .orb-eye {
      animation: eye-pop 0.45s ease;
    }
    @keyframes orb-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes shake-orb {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes eye-pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }
    .step-card {
      width: 100%;
      background: #111128;
      border-radius: 8px;
      border-left: 3px solid #2DD4BF;
      padding: 10px 12px;
      margin: 12px 0;
    }
    .step-card__label {
      display: block;
      font-size: 9px;
      color: #2DD4BF;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    #step-instruction {
      color: #94A3B8;
      font-size: 12px;
      line-height: 1.5;
    }
    .stembot-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }
    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-teal {
      background: linear-gradient(135deg, #0D9488, #0F766E);
      border: 1px solid rgba(45, 212, 191, 0.3);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      height: 44px;
      box-shadow: 0 4px 16px rgba(13, 148, 136, 0.3);
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease, filter 0.2s ease;
    }
    .btn-teal:not(:disabled) {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }
    .btn-teal:not(:disabled):hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: transparent;
      color: #6B7280;
      border: 1px solid #2D2D50;
      font-size: 13px;
      height: 38px;
    }
    .btn-ghost:not(:disabled):hover {
      border-color: #4B5563;
      color: #9CA3AF;
    }
    .btn-ghost:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #step-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-top: 12px;
      margin-top: auto;
    }
    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1E1E3A;
      border: 1px solid #374151;
      flex-shrink: 0;
    }
    .step-dot.done {
      background: #2DD4BF;
      border-color: #2DD4BF;
      box-shadow: 0 0 6px rgba(45, 212, 191, 0.6);
    }
    .step-dot.current {
      width: 10px;
      height: 10px;
      background: transparent;
      border: 2px solid #2DD4BF;
      box-shadow: 0 0 8px rgba(45, 212, 191, 0.5);
      animation: dot-pulse 1.5s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(45, 212, 191, 0.4); }
      50% { box-shadow: 0 0 12px rgba(45, 212, 191, 0.8); }
    }
    #tool-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas-bg);
      position: relative;
    }
    #tool-root {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* Circuit builder */
    .circuit-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .circuit-canvas-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      background: var(--canvas-bg);
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .canvas-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at 50% 40%, rgba(13, 9, 30, 0) 0%, rgba(5, 5, 16, 0.4) 100%);
    }
    #circuit-drop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 3;
    }
    #circuit-wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }
    #circuit-wires path.wire-visible {
      stroke: #F97316 !important;
      stroke-width: 2.5 !important;
      fill: none !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      pointer-events: none;
    }
    #circuit-wires path.wire-visible.wire-glow {
      stroke: #00FFFF !important;
      stroke-width: 3 !important;
      filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.6)) drop-shadow(0 0 8px rgba(0, 255, 255, 0.3)) !important;
    }
    #circuit-wires path.wire-visible.wire-selected {
      stroke: #EF4444 !important;
      stroke-width: 3.5 !important;
    }
    #circuit-wires path.wire-hit {
      pointer-events: stroke;
      cursor: pointer;
      fill: none;
      stroke: transparent;
      stroke-width: 22 !important;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #circuit-wires path.wire-hit.wire-selected {
      stroke: rgba(239, 68, 68, 0.12) !important;
    }
    .placed-comp {
      position: absolute;
      z-index: 3;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .placed-comp::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 12px;
      border: 2px dashed transparent;
      pointer-events: none;
      transition: border-color 0.15s ease;
    }
    .placed-comp:focus-within::before,
    .placed-comp.comp-selected::before {
      border-color: #2DD4BF;
      animation: dash-rotate 8s linear infinite;
    }
    @keyframes dash-rotate {
      to { stroke-dashoffset: -100; }
    }
    .placed-comp.dragging {
      cursor: grabbing;
      z-index: 10;
      opacity: 0.85;
    }
    .placed-comp svg { display: block; pointer-events: none; }
    .terminal {
      position: absolute;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border-radius: 50%;
      z-index: 10;
      cursor: crosshair;
      touch-action: manipulation;
      pointer-events: auto;
      border: 2px solid rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .terminal.positive { background: #ef4444; }
    .terminal.negative { background: #6b7280; }
    .terminal.neutral { background: #94a3b8; }
    .terminal:hover {
      transform: scale(1.4);
      box-shadow: 0 0 8px currentColor;
    }
    .terminal.selected {
      animation: terminal-pulse 0.8s ease-in-out infinite;
      box-shadow: 0 0 12px currentColor;
      outline: none;
    }
    @keyframes terminal-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .comp-battery-svg .battery-body {
      filter: drop-shadow(inset 0 1px 2px rgba(0, 0, 0, 0.35));
    }
    .comp-led-svg .led-lens { fill: #0E3A4A !important; }
    .comp-led-svg.lit .led-lens { fill: #00FFFF !important; }
    .comp-led-svg .led-rays { opacity: 0.35; }
    .comp-led-svg.lit {
      filter: drop-shadow(0 0 8px #00FFFF) drop-shadow(0 0 16px #06B6D4);
      animation: led-flicker 0.1s ease infinite;
    }
    .comp-led-svg.lit .led-rays {
      opacity: 1;
      stroke: #00FFFF;
    }
    @keyframes led-flicker {
      0%, 100% { filter: drop-shadow(0 0 8px #00FFFF) drop-shadow(0 0 16px #06B6D4); }
      50% { filter: drop-shadow(0 0 12px #00FFFF) drop-shadow(0 0 24px #06B6D4); }
    }
    .comp-bulb-svg .bulb-glass { fill: #374151 !important; }
    .comp-bulb-svg .bulb-filament { stroke: #6B7280; opacity: 0.6; }
    .comp-bulb-svg.lit .bulb-glass {
      fill: #FDE68A !important;
      filter: drop-shadow(0 0 10px #FBBF24) drop-shadow(0 0 20px rgba(251, 191, 36, 0.5));
    }
    .comp-bulb-svg.lit .bulb-filament {
      stroke: #F59E0B;
      opacity: 1;
    }
    .comp-bulb-svg.lit {
      animation: bulb-glow 0.15s ease-in-out infinite alternate;
    }
    @keyframes bulb-glow {
      from { filter: drop-shadow(0 0 8px #FBBF24); }
      to { filter: drop-shadow(0 0 16px #FCD34D); }
    }
    .canvas-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 20px);
    }
    .canvas-toolbar .toolbar-label {
      font-size: 11px;
      color: #94A3B8;
      padding: 0 4px;
      min-width: 0;
    }
    .canvas-toolbar .toolbar-label:empty { display: none; }
    .btn-clear-canvas,
    .btn-delete-sel {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-clear-canvas {
      background: transparent;
      color: #6B7280;
      border: 1px solid #2D2D50;
    }
    .btn-clear-canvas:hover {
      border-color: #4B5563;
      color: #9CA3AF;
    }
    .btn-delete-sel {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #FCA5A5;
    }
    .btn-delete-sel:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.28);
    }
    .btn-delete-sel:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .circuit-hint-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 6px 14px;
      background: rgba(10, 10, 24, 0.92);
      border: 1px solid #2D2D50;
      border-radius: 20px;
      font-size: 10px;
      color: #6B7280;
      pointer-events: none;
      white-space: nowrap;
    }
    .parts-tray {
      height: 110px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      gap: 10px;
      padding: 10px 14px;
      background: #080A14;
      border-top: 2px solid #1E2A4A;
      overflow-x: auto;
    }
    .tray-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 9px;
      color: #4B5563;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      flex-shrink: 0;
      align-self: center;
      padding: 0 4px;
    }
    .tray-chips-row {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
    }
    .tray-chip {
      flex-shrink: 0;
      width: 90px;
      height: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      padding: 8px 6px 6px;
      margin: 0 6px;
      background: #0F1629;
      border: 1px solid #1E2A4A;
      border-radius: 10px;
      cursor: grab;
      touch-action: none;
      transition: all 0.15s ease;
    }
    .tray-chip:hover {
      background: #141D35;
      border-color: #2D4A8A;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .tray-chip:active,
    .tray-chip.dragging {
      opacity: 0.7;
      cursor: grabbing;
    }
    .tray-chip .chip-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }
    .tray-chip .chip-label {
      font-size: 11px;
      color: #6B7280;
      text-align: center;
    }
    .tray-chip .chip-note {
      font-size: 8px;
      color: #4B5563;
      text-align: center;
      line-height: 1.2;
    }
    .tray-chip.wire-hint { cursor: help; }
  /* Blocks tool */
    .blocks-wrap {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .blocks-palette {
      width: 160px;
      flex-shrink: 0;
      padding: 12px 8px;
      background: rgba(8, 8, 16, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .block-chip {
      width: 140px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #0f172a;
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
    }
    .blocks-workspace-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }
    .blocks-toolbar {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }
  .btn-run { background: #22c55e; color: #052e16; }
    #blocks-workspace {
      flex: 1;
      padding: 48px 24px 24px;
      overflow-y: auto;
      min-height: 120px;
    }
    .workspace-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      min-height: 80px;
    }
    .workspace-block {
      width: 140px;
      min-height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #0f172a;
      cursor: grab;
      touch-action: none;
      position: relative;
      margin-bottom: -4px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
    }
    .workspace-block .inline-input {
      width: 28px;
      margin: 0 4px;
      padding: 2px 4px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }
    .workspace-block.snap-highlight {
      outline: 2px dashed var(--teal);
      outline-offset: 4px;
    }
    #blocks-output {
      height: 0;
      overflow: hidden;
      background: #0a0a14;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      transition: height 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    #blocks-output.open { height: 160px; }
    #blocks-log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #a5f3fc;
    }
    #blocks-mini-grid {
      height: 72px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 15px,
        rgba(255, 255, 255, 0.04) 15px,
        rgba(255, 255, 255, 0.04) 16px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 15px,
        rgba(255, 255, 255, 0.04) 15px,
        rgba(255, 255, 255, 0.04) 16px
      );
    }
    #blocks-robot {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 18px solid var(--teal);
      transform: translate(-50%, -50%);
      transition: left 0.25s ease, top 0.25s ease;
    }
    /* 3D viewer */
    .viewer-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #three-container {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #three-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .shape-tray {
      height: 80px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(8, 8, 16, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
    }
    .shape-chip {
      flex-shrink: 0;
      width: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
    }
    .shape-chip:hover { border-color: rgba(20, 184, 166, 0.4); }
    .shape-chip canvas { width: 60px; height: 60px; border-radius: 6px; background: #12121f; }
    .shape-chip span { font-size: 9px; color: var(--muted); text-transform: capitalize; }
    #shape-toolbar {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: none;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(12, 12, 24, 0.95);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      align-items: center;
      max-width: 90%;
    }
    #shape-toolbar.visible { display: flex; }
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }
    .color-swatch.active { border-color: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.5); }
    /* Complete overlay */
    #complete-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(8, 8, 16, 0.88);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }
    #complete-overlay.visible { display: flex; }
    #complete-overlay h2 {
      font-size: 28px;
      margin: 16px 0 8px;
      color: var(--teal);
    }
    #complete-overlay .stats { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    #complete-overlay .btn-finish {
      background: var(--teal);
      color: #042f2e;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    /* Debug bar */
    #debug-bar {
      display: none;
      flex-shrink: 0;
      max-height: 120px;
      overflow: auto;
      background: #1e1e2e;
      border-top: 1px solid #333;
      padding: 8px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      color: #86efac;
    }
    #debug-bar.visible { display: block; }
    #debug-controls {
      display: none;
      gap: 8px;
      padding: 4px 8px;
    }
    #debug-controls.visible { display: flex; }
  </style>
</head>
<body>
  <div id="stars"></div>
  <div id="app">
    <header id="topbar">
      <span class="logo">STEMverse</span>
      <span class="title" id="activity-title"></span>
      <div id="topbar-actions">
        <button type="button" class="btn-save" id="btn-save" title="Save your progress" hidden>Save</button>
        <span class="step-counter" id="step-counter">Step 1 of 1</span>
      </div>
    </header>
    <div id="save-toast" role="status"></div>
    <div id="main">
      <aside id="left-panel">
        <div class="panel-top-bar">STEMverse</div>
        <div class="stembot-wrap">
          <div class="speech-bubble" id="speech-bubble"><span id="bubble-text"></span></div>
          <div id="stembot-orb" class="orb-wrap" aria-hidden="true">
            <div class="orb-ring"></div>
            <div class="orb-inner">
              <svg class="orb-face" viewBox="0 0 80 80" aria-hidden="true">
                <ellipse class="orb-eye orb-eye-l" cx="26" cy="30" rx="4" ry="2.5" />
                <ellipse class="orb-eye orb-eye-r" cx="54" cy="30" rx="4" ry="2.5" />
                <path class="orb-smile" d="M30 42 Q40 48 50 42" fill="none" stroke-width="2" stroke-linecap="round" />
              </svg>
            </div>
          </div>
          <div class="step-card" id="step-card">
            <span class="step-card__label">CURRENT STEP</span>
            <p id="step-instruction"></p>
          </div>
          <div class="stembot-actions">
            <button type="button" class="btn btn-teal" id="btn-next" disabled>Next step →</button>
            <button type="button" class="btn btn-ghost" id="btn-hint">Give me a hint</button>
          </div>
          <div id="step-dots"></div>
        </div>
      </aside>
      <section id="tool-panel">
        <div id="tool-root"></div>
        <div id="debug-controls">
          <button type="button" class="btn btn-ghost" id="btn-skip-step">Skip step</button>
        </div>
        <pre id="debug-bar"></pre>
      </section>
    </div>
  </div>
  <div id="complete-overlay">
    <svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
      <circle cx="40" cy="40" r="38" fill="none" stroke="#14b8a6" stroke-width="3" />
      <path d="M22 40 L36 54 L58 28" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h2>Activity Complete!</h2>
    <p class="stats" id="complete-stats"></p>
    <button type="button" class="btn-finish" id="btn-finish">Finish</button>
  </div>

  <script>
  var ACTIVITY_CONFIG = {
    tool: "circuit_builder",
    title: "Build a simple circuit",
    subject: "Electricity",
    grade: "8-10",
    stembot_intro: "Hey! I'm STEMbot. Let's build a circuit together.",
    components: ["battery", "wire", "led", "switch", "resistor", "buzzer", "motor", "capacitor", "diode", "bulb", "fuse", "button"],
    steps: [
      {
        id: 1,
        instruction: "Drag the battery onto the canvas.",
        hint: "The battery is the yellow rectangle in the parts tray.",
        completion_trigger: "component_placed:battery",
        stembot_reaction_correct: "Great work! The battery is your power source.",
        stembot_emotion_correct: "celebrate"
      },
      {
        id: 2,
        instruction: "Now connect a wire from the + terminal (red dot) on the battery.",
        hint: "Click the red dot on the battery, then click another terminal to draw a wire.",
        completion_trigger: "wire_connected:battery_positive",
        stembot_reaction_correct: "Perfect! Electricity will flow through this wire.",
        stembot_emotion_correct: "excited"
      },
      {
        id: 3,
        instruction: "Place an LED on the canvas.",
        hint: "The LED is the cyan circle in the parts tray.",
        completion_trigger: "component_placed:led",
        stembot_reaction_correct: "Nice! The LED will light up when current flows through it.",
        stembot_emotion_correct: "correct"
      },
      {
        id: 4,
        instruction: "Build a closed circuit so the LED lights up. Close the switch if you added one!",
        hint: "Connect battery + → LED → battery − with wires. Click terminals in order.",
        completion_trigger: "circuit_closed",
        stembot_reaction_correct: "You did it! The circuit is complete and the LED is glowing!",
        stembot_emotion_correct: "celebrate"
      }
    ]
  };

  (function applyUrlConfig() {
    const params = new URLSearchParams(location.search);
    const b64 = params.get("config");
    if (!b64) return;
    try {
      const raw = decodeURIComponent(escape(atob(decodeURIComponent(b64))));
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        ACTIVITY_CONFIG = Object.assign({}, ACTIVITY_CONFIG, parsed);
        if (Array.isArray(parsed.steps)) ACTIVITY_CONFIG.steps = parsed.steps;
        if (Array.isArray(parsed.components)) ACTIVITY_CONFIG.components = parsed.components;
      }
    } catch (err) {
      console.warn("[STEMverse tool player] Could not parse ?config=", err);
    }
  })();
  </script>

  <script>
  (function () {
    "use strict";

    const EMOTION_COLORS = {
      idle: "#f59e0b",
      thinking: "#3B82F6",
      correct: "#10B981",
      celebrate: "#F59E0B",
      hint: "#EF4444",
      excited: "#10B981"
    };

    const urlParams = new URLSearchParams(location.search);
    const MISSION_ID = String(urlParams.get("mission_id") || "").trim();
    const HAS_MISSION = MISSION_ID.length > 0;
    const IS_PREVIEW = urlParams.get("preview") === "1";
    let savedProjectId = "";

    function apiFetch(url, init) {
      const headers = Object.assign({ "Content-Type": "application/json" }, (init && init.headers) || {});
      try {
        const token = localStorage.getItem("stemverse_access_token");
        if (token) headers.Authorization = "Bearer " + token;
      } catch (e) { /* ignore */ }
      return fetch(url, Object.assign({}, init || {}, { credentials: "include", headers: headers }));
    }

    const NUDGE_MESSAGES = [
      "Stuck? Try clicking something on the canvas.",
      "You can do it! What haven't you tried yet?",
      "Tip: read the instruction again carefully.",
      "Need a hint? Press the hint button!"
    ];

    const WRONG_MSG = "Hmm, that's not quite right — try again!";

    const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
    const startedAt = Date.now();

    const appState = {
      currentStepIndex: 0,
      stepCompleted: false,
      allDone: false,
      introComplete: false,
      firedTriggers: new Set(),
      triggerLog: [],
      wrongCount: 0,
      lastEmotion: "idle",
      activityStart: startedAt
    };

    function totalScreens() {
      return 1 + ACTIVITY_CONFIG.steps.length;
    }

    function currentScreenNumber() {
      if (!appState.introComplete) return 1;
      return appState.currentStepIndex + 2;
    }

    let typewriterTimer = null;
    let idleTimer = null;
    let wrongResetTimer = null;
    let currentTool = null;

    const $ = (sel) => document.querySelector(sel);
    const bubbleText = $("#bubble-text");
    const speechBubble = $("#speech-bubble");
    const orb = $("#stembot-orb");
    const btnNext = $("#btn-next");
    const btnHint = $("#btn-hint");
    const stepDots = $("#step-dots");
    const toolRoot = $("#tool-root");
    const stepCounter = $("#step-counter");
    const activityTitle = $("#activity-title");
    const debugBar = $("#debug-bar");
    const debugControls = $("#debug-controls");
    const btnSave = $("#btn-save");
    const saveToast = $("#save-toast");

    function progressStorageKey() {
      try {
        const cfg = btoa(unescape(encodeURIComponent(JSON.stringify({ t: ACTIVITY_CONFIG.tool, title: ACTIVITY_CONFIG.title })))).slice(0, 32);
        return "stemverse_tool_prog_" + (MISSION_ID || cfg);
      } catch (e) {
        return "stemverse_tool_prog_" + MISSION_ID;
      }
    }

    function showSaveToast(msg) {
      if (!saveToast) return;
      saveToast.textContent = msg;
      saveToast.classList.add("visible");
      setTimeout(function () { saveToast.classList.remove("visible"); }, 2600);
    }

    function exportProgressPayload() {
      const workspace = currentTool && currentTool.exportState ? currentTool.exportState() : null;
      return {
        version: 1,
        tool: ACTIVITY_CONFIG.tool,
        currentStepIndex: appState.currentStepIndex,
        stepCompleted: appState.stepCompleted,
        firedTriggers: Array.from(appState.firedTriggers),
        workspace: workspace
      };
    }

    async function saveProgress() {
      const json = JSON.stringify(exportProgressPayload());
      try { localStorage.setItem(progressStorageKey(), json); } catch (e) { /* ignore */ }
      if (btnSave) btnSave.disabled = true;
      if (IS_PREVIEW) {
        showSaveToast("Saved locally (preview mode)");
        if (btnSave) btnSave.disabled = true;
        return;
      }
      if (HAS_MISSION) {
        try {
          const res = await apiFetch("/api/tool-activity/save", {
            method: "POST",
            body: JSON.stringify({
              id: savedProjectId || undefined,
              mission_id: MISSION_ID,
              title: ACTIVITY_CONFIG.title || "Tool activity",
              workspace_json: json
            })
          });
          const data = await res.json().catch(function () { return {}; });
          if (data.id) savedProjectId = data.id;
          showSaveToast(res.ok ? "Progress saved!" : "Saved on this device");
        } catch (e) {
          showSaveToast("Saved on this device");
        }
      } else {
        showSaveToast("Progress saved on this device");
      }
      if (btnSave) btnSave.disabled = false;
    }

    async function loadProgress() {
      var json = null;
      try { json = localStorage.getItem(progressStorageKey()); } catch (e) { /* ignore */ }
      if (!json && HAS_MISSION && !IS_PREVIEW) {
        try {
          const res = await apiFetch("/api/tool-activity/progress?mission_id=" + encodeURIComponent(MISSION_ID));
          if (res.ok) {
            const data = await res.json();
            if (data.save) {
              json = data.save.workspace_json;
              savedProjectId = data.save.id;
            }
          }
        } catch (e) { /* ignore */ }
      }
      if (!json) return;
      try {
        const payload = JSON.parse(json);
        if (payload.firedTriggers && Array.isArray(payload.firedTriggers)) {
          payload.firedTriggers.forEach(function (t) { appState.firedTriggers.add(t); });
        }
        if (typeof payload.currentStepIndex === "number") {
          appState.currentStepIndex = Math.min(payload.currentStepIndex, ACTIVITY_CONFIG.steps.length - 1);
          appState.stepCompleted = !!payload.stepCompleted;
          appState.introComplete = true;
        }
        if (payload.introComplete) appState.introComplete = true;
        if (payload.workspace && currentTool && currentTool.importState) {
          currentTool.importState(payload.workspace);
        }
        updateStepUI();
        var step = getCurrentStep();
        if (step) typewrite(step.instruction);
        checkAllTriggers();
      } catch (e) { /* ignore corrupt save */ }
    }

    function logTrigger(name) {
      appState.triggerLog.push({ t: Date.now(), name });
      if (DEBUG) updateDebugBar();
    }

    function updateDebugBar() {
      debugBar.textContent =
        "STATE: " + JSON.stringify(appState, (k, v) => (v instanceof Set ? [...v] : v), 2) +
        "\n\nLOG:\n" + appState.triggerLog.map((e) => new Date(e.t).toISOString().slice(11, 19) + " " + e.name).join("\n");
    }

    function createStars() {
      const container = document.getElementById("stars");
      for (let i = 0; i < 80; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.opacity = (0.3 + Math.random() * 0.3).toFixed(2);
        container.appendChild(s);
      }
    }

    function setEmotion(emotion) {
      const e = emotion || "idle";
      appState.lastEmotion = e;
      orb.style.background = "";
      orb.style.boxShadow = "";
      orb.className = "orb-wrap emotion-" + e;
    }

    function typewrite(text, cb) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      bubbleText.innerHTML = "";
      let i = 0;
      const full = String(text || "");
      typewriterTimer = setInterval(() => {
        if (i < full.length) {
          bubbleText.textContent = full.slice(0, i + 1);
          i++;
        } else {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
          bubbleText.innerHTML = full + '<span class="cursor"></span>';
          if (cb) cb();
        }
      }, 30);
    }

    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (appState.allDone) return;
        const msg = NUDGE_MESSAGES[Math.floor(Math.random() * NUDGE_MESSAGES.length)];
        typewrite(msg);
        setEmotion("thinking");
      }, 20000);
    }

    function onCanvasInteraction() {
      resetIdleTimer();
    }

    function showWrong() {
      appState.wrongCount++;
      setEmotion("hint");
      typewrite(WRONG_MSG);
      if (wrongResetTimer) clearTimeout(wrongResetTimer);
      wrongResetTimer = setTimeout(() => {
        setEmotion(appState.stepCompleted ? "correct" : "idle");
        const step = getCurrentStep();
        if (step && !appState.stepCompleted) typewrite(step.instruction);
      }, 2000);
      if (appState.wrongCount >= 3) {
        const step = getCurrentStep();
        if (step && step.hint) {
          setTimeout(() => {
            typewrite("Here's a hint: " + step.hint);
            setEmotion("thinking");
          }, 2100);
        }
      }
    }

    function getCurrentStep() {
      return ACTIVITY_CONFIG.steps[appState.currentStepIndex] || null;
    }

    function updateStepUI() {
      const stepsTotal = Math.max(1, ACTIVITY_CONFIG.steps.length);
      const stepNum = appState.introComplete ? Math.min(stepsTotal, appState.currentStepIndex + 1) : 1;
      stepCounter.textContent = "Step " + stepNum + " of " + stepsTotal;
      stepDots.innerHTML = "";
      const d0 = document.createElement("div");
      d0.className = "step-dot";
      if (appState.introComplete) d0.classList.add("done");
      if (!appState.introComplete) d0.classList.add("current");
      stepDots.appendChild(d0);
      ACTIVITY_CONFIG.steps.forEach((_, i) => {
        const d = document.createElement("div");
        d.className = "step-dot";
        if (appState.introComplete && i < appState.currentStepIndex) d.classList.add("done");
        if (appState.introComplete && i === appState.currentStepIndex) d.classList.add("current");
        stepDots.appendChild(d);
      });
      if (appState.allDone) btnNext.disabled = true;
      else if (!appState.introComplete) btnNext.disabled = false;
      else btnNext.disabled = !appState.stepCompleted;
    }

    function fireTrigger(triggerName) {
      if (appState.firedTriggers.has(triggerName)) return;
      appState.firedTriggers.add(triggerName);
      logTrigger(triggerName);
      checkStepCompletion(triggerName);
    }

    function checkStepCompletion(triggerName) {
      const step = getCurrentStep();
      if (!step || appState.stepCompleted) return;
      if (step.completion_trigger === triggerName) {
        appState.stepCompleted = true;
        setEmotion(step.stembot_emotion_correct || "correct");
        typewrite(step.stembot_reaction_correct || "Well done!");
        btnNext.disabled = false;
        updateStepUI();
      }
    }

    function checkAllTriggers() {
      const step = getCurrentStep();
      if (!step || appState.stepCompleted) return;
      if (currentTool && currentTool.evaluateTriggers) {
        currentTool.evaluateTriggers(step.completion_trigger);
      }
    }

    function showStepInstruction() {
      const step = getCurrentStep();
      if (!step) return;
      appState.stepCompleted = false;
      appState.wrongCount = 0;
      setEmotion("idle");
      const stepInst = document.getElementById("step-instruction");
      if (stepInst) stepInst.textContent = step.instruction;
      typewrite(step.instruction);
      btnNext.disabled = true;
      updateStepUI();
      if (currentTool && currentTool.onStepChange) currentTool.onStepChange();
    }

    function advanceStep() {
      if (!appState.introComplete) {
        appState.introComplete = true;
        appState.stepCompleted = false;
        updateStepUI();
        showStepInstruction();
        return;
      }
      if (!appState.stepCompleted) return;
      appState.currentStepIndex++;
      if (appState.currentStepIndex >= ACTIVITY_CONFIG.steps.length) {
        completeActivity();
        return;
      }
      showStepInstruction();
    }

    function completeActivity() {
      appState.allDone = true;
      setEmotion("celebrate");
      typewrite("Amazing work, Cadet! Mission complete! 🌟");
      btnNext.disabled = true;
      const elapsed = Math.max(1, Math.round((Date.now() - appState.activityStart) / 60000));
      $("#complete-stats").textContent =
        "Completed " + totalScreens() + " screens in about " + elapsed + " minute" + (elapsed === 1 ? "" : "s");
      setTimeout(() => $("#complete-overlay").classList.add("visible"), 1200);
    }

    function finishAndPost() {
      window.parent.postMessage(
        {
          type: "STEMVERSE_COMPLETE",
          activity: "tool",
          tool: ACTIVITY_CONFIG.tool,
          title: ACTIVITY_CONFIG.title,
          steps_completed: ACTIVITY_CONFIG.steps.length,
          timestamp: Date.now()
        },
        "*"
      );
    }

    btnNext.addEventListener("click", advanceStep);
    btnHint.addEventListener("click", () => {
      const step = getCurrentStep();
      if (step && step.hint) {
        typewrite(step.hint);
        setEmotion("thinking");
      }
    });

    $("#btn-finish").addEventListener("click", finishAndPost);

    if (DEBUG) {
      debugBar.classList.add("visible");
      debugControls.classList.add("visible");
      $("#btn-skip-step").addEventListener("click", () => {
        const step = getCurrentStep();
        if (step) {
          fireTrigger(step.completion_trigger);
          appState.stepCompleted = true;
          btnNext.disabled = false;
        }
      });
      updateDebugBar();
    }

    /* ========== CIRCUIT BUILDER ========== */
    const CIRCUIT_CHIP_DEFS = {
      battery:
        '<svg width="70" height="38" viewBox="0 0 70 38" aria-hidden="true"><rect class="battery-body" x="2" y="7" width="54" height="24" rx="4" fill="#1A1A2E" stroke="#F59E0B" stroke-width="1.5"/><rect x="56" y="12" width="10" height="14" rx="2" fill="#EF4444"/><line x1="18" y1="9" x2="18" y2="29" stroke="#F59E0B" stroke-width="0.5" opacity="0.4"/><line x1="36" y1="9" x2="36" y2="29" stroke="#F59E0B" stroke-width="0.5" opacity="0.4"/><text x="61" y="22" fill="#EF4444" font-size="10" font-weight="bold" text-anchor="middle">+</text><text x="8" y="22" fill="#9CA3AF" font-size="10" text-anchor="middle">−</text></svg>',
      led:

      buzzer:
        '<svg width="60" height="44" viewBox="0 0 60 44" aria-hidden="true"><rect x="8" y="8" width="30" height="28" rx="4" fill="#1A1A2E" stroke="#9CA3AF" stroke-width="1.5"/><line x1="14" y1="16" x2="32" y2="16" stroke="#374151" stroke-width="1"/><line x1="14" y1="22" x2="32" y2="22" stroke="#374151" stroke-width="1"/><line x1="14" y1="28" x2="32" y2="28" stroke="#374151" stroke-width="1"/><path d="M42 14 A6 6 0 0 1 42 26" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.7"/><path d="M46 11 A10 10 0 0 1 46 29" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.7"/><path d="M50 8 A14 14 0 0 1 50 32" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.7"/><line x1="16" y1="36" x2="16" y2="42" stroke="#9CA3AF" stroke-width="1.5"/><line x1="30" y1="36" x2="30" y2="42" stroke="#9CA3AF" stroke-width="1.5"/></svg>',
      motor:
        '<svg width="60" height="50" viewBox="0 0 60 50" aria-hidden="true"><circle cx="30" cy="22" r="14" fill="#1A1A2E" stroke="#60A5FA" stroke-width="1.5"/><text x="30" y="26" fill="#60A5FA" font-size="11" font-weight="bold" text-anchor="middle">M</text><line x1="16" y1="38" x2="16" y2="48" stroke="#9CA3AF" stroke-width="1.5"/><line x1="44" y1="38" x2="44" y2="48" stroke="#9CA3AF" stroke-width="1.5"/><line x1="30" y1="36" x2="30" y2="48" stroke="#9CA3AF" stroke-width="1.5"/></svg>',
